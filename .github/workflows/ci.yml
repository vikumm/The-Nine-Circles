name: MMO-VS1 CI

on:
  push:
  pull_request:

jobs:
  restore-build-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Validate Compose config
        run: docker compose -f infra/compose/compose.yml config

      - name: Restore solution
        run: dotnet restore Divinity.sln

      - name: Build solution
        run: dotnet build Divinity.sln --configuration Release --no-restore

      - name: VS-001 smoke tests
        run: dotnet run --project packages/test-fixtures/smoke-tests/Divinity.SmokeTests.csproj --configuration Release --no-build

      - name: Restore protocol tests
        run: dotnet restore packages/contracts-proto/tests/Divinity.ContractsProto.Tests.csproj

      - name: Build protocol contracts
        run: dotnet build packages/contracts-proto/Divinity.ContractsProto.csproj --configuration Release --no-restore

      - name: VS-003 protocol tests
        run: dotnet run --project packages/contracts-proto/tests/Divinity.ContractsProto.Tests.csproj --configuration Release

      - name: Restore content builder tests
        run: dotnet restore tools/content-builder/tests/Divinity.ContentBuilder.Tests.csproj

      - name: Build content schema
        run: dotnet build packages/content-schema/Divinity.ContentSchema.csproj --configuration Release --no-restore

      - name: Build content builder
        run: dotnet build tools/content-builder/Divinity.ContentBuilder.csproj --configuration Release --no-restore

      - name: VS-004 content tests
        run: dotnet run --project tools/content-builder/tests/Divinity.ContentBuilder.Tests.csproj --configuration Release

      - name: VS-004 content artifacts
        run: dotnet run --project tools/content-builder/Divinity.ContentBuilder.csproj --configuration Release -- build --content-root content --output-root tools/content-builder/artifacts

      - name: Restore launcher auth tests
        run: dotnet restore apps/launcher/tests/Divinity.Launcher.Tests.csproj

      - name: Build launcher auth tests
        run: dotnet build apps/launcher/tests/Divinity.Launcher.Tests.csproj --configuration Release --no-restore

      - name: VS-005 launcher auth tests
        run: dotnet run --project apps/launcher/tests/Divinity.Launcher.Tests.csproj --configuration Release --no-build

      - name: Start Keycloak for VS-005
        run: docker compose -f infra/compose/compose.yml up -d keycloak

      - name: Wait for Keycloak realm
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/realms/divinity-dev/.well-known/openid-configuration >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f infra/compose/compose.yml logs keycloak
          exit 1

      - name: VS-005 Keycloak login test
        env:
          DIVINITY_RUN_KEYCLOAK_LOGIN_TEST: "true"
          DIVINITY_LAUNCHER_OIDC_AUTHORITY: http://127.0.0.1:8080/realms/divinity-dev
          DIVINITY_LAUNCHER_OIDC_CLIENT_ID: divinity-launcher-dev
          DIVINITY_KEYCLOAK_DEV_USERNAME: divinity.dev
          DIVINITY_KEYCLOAK_DEV_PASSWORD: divinity_dev_password
        run: dotnet run --project apps/launcher/tests/Divinity.Launcher.Tests.csproj --configuration Release --no-build

      - name: Restore game ticket tests
        run: dotnet restore packages/test-fixtures/game-ticket-tests/Divinity.GameTicketTests.csproj

      - name: Build game ticket tests
        run: dotnet build packages/test-fixtures/game-ticket-tests/Divinity.GameTicketTests.csproj --configuration Release --no-restore

      - name: VS-006 game ticket tests
        run: dotnet run --project packages/test-fixtures/game-ticket-tests/Divinity.GameTicketTests.csproj --configuration Release --no-build

      - name: Stop Keycloak
        if: always()
        run: docker compose -f infra/compose/compose.yml down
